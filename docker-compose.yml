services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      # Foodly uses Supabase (PostgreSQL via REST), not a bundled postgres service.
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in your .env file}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in your .env file}
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      CORS_ORIGINS: http://localhost:80,http://localhost:5173
      PORT: "3000"
      NODE_ENV: production
      # Optional AI features (vision search + embeddings). Leave empty to use
      # the built-in keyword fallback.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
    ports:
      - "3000:3000"
      - "3001:3001"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
