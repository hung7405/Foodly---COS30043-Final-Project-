services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealmap
      POSTGRES_USER: dealmap
      POSTGRES_PASSWORD: dealmap_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dealmap:dealmap_secret@postgres:5432/dealmap
      TYPEORM_SYNC: "true"
      CORS_ORIGINS: http://localhost:80,http://localhost:5173
      JWT_SECRET: change-in-production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
